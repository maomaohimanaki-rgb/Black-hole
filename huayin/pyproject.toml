[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "huayin"
version = "1.0.0"
description = "华音 Huayin: motor de síntese física de instrumentos clássicos chineses (pipa Tang, guqin, guzheng, erhu, dizi, bianzhong e mais)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59", "soundfile>=0.12", "mido>=1.3"]

[project.optional-dependencies]
extras = ["sounddevice>=0.4", "matplotlib>=3.7"]

[project.scripts]
huayin = "huayin.cli:main"

[tool.setuptools.packages.find]
include = ["huayin*"]
